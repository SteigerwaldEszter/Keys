
name: Kulcskezelo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Python környezet beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ruff és Pytest telepítése
        run: |
          python -m pip install ruff==0.16.9 pytest==7.4.3

      - name: Ruff ellenőrzés
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Egységtesztek
        run: python -m pytest tests -q